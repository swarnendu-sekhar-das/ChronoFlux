server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/admin {
        proxy_pass http://admin-api:8080;
    }

    location /api/v1 {
        proxy_pass http://edge-api:8081;
    }

    location /login {
        proxy_pass http://admin-api:8080;
    }
}
