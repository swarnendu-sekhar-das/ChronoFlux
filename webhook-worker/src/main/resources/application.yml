server:
  port: 0 # Random port for scaling

spring:
  application:
    name: webhook-worker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:chronoflux}}
    username: ${POSTGRES_USER:chronoflux}
    password: ${POSTGRES_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false # Only admin-api manages migrations
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        prefetch: 1

resilience4j:
  retry:
    instances:
      webhookRetry:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - com.example.webhook_worker.exception.RetryableWebhookException
        ignore-exceptions:
          - com.example.webhook_worker.exception.NonRetryableWebhookException
