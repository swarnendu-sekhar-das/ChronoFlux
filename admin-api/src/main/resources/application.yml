server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api/admin

spring:
  application:
    name: admin-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:chronoflux}}
    username: ${POSTGRES_USER:chronoflux}
    password: ${POSTGRES_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

admin:
  allowed:
    emails: ${ADMIN_ALLOWED_EMAILS:admin@chronoflux.com,employee.esdproject@gmail.com}
